# Copies MSYS2's zsh package for x86_64 into a GitHub release here
# (zsh-v<version>, for example zsh-v5.9.2-1), so a network that blocks
# repo.msys2.org can still get zsh for Git for Windows. The package and its
# .sig are published as they came, after gpg checks the .sig against MSYS2's
# packager and master keys from github.com/msys2/MSYS2-keyring. The release never takes
# the latest mark, which stays with the Herdr app.
name: zsh

on:
  schedule:
    - cron: "40 3 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to mirror, such as 5.9.2-1 (empty: the newest)"
        required: false

permissions:
  contents: write

concurrency:
  group: zsh
  cancel-in-progress: false

env:
  REPO_URL: https://repo.msys2.org/msys/x86_64
  UA: "herdr-app-mirror (+https://github.com/${{ github.repository }})"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick the version
        id: pick
        env:
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${WANT:-}" ]; then
            version="$WANT"
          else
            # The index lists every build kept; sort -V puts the newest last.
            version=$(curl -fsSL -A "$UA" "$REPO_URL/" \
              | grep -oE 'zsh-[0-9][0-9.]*-[0-9]+-x86_64\.pkg\.tar\.zst"' \
              | sed -E 's/^zsh-(.*)-x86_64\.pkg\.tar\.zst"$/\1/' | sort -uV | tail -n 1)
          fi
          [ -n "$version" ] || { echo "no zsh package in $REPO_URL"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=zsh-$version-x86_64.pkg.tar.zst" >> "$GITHUB_OUTPUT"

      - name: Skip a version already mirrored
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
          FILE: ${{ steps.pick.outputs.file }}
        run: |
          if gh release view "zsh-v$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$FILE"; then
            echo "zsh-v$VERSION already has $FILE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and check
        if: steps.have.outputs.skip != 'true'
        env:
          FILE: ${{ steps.pick.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p dist keys
          curl -fsSL -A "$UA" --retry 3 "$REPO_URL/$FILE" -o "dist/$FILE"
          curl -fsSL -A "$UA" --retry 3 "$REPO_URL/$FILE.sig" -o "dist/$FILE.sig"
          # MSYS2 signs packages with packager keys, each certified by its
          # master keys. msys2.gpg, from MSYS2's keyring repo, holds both, as
          # pacman imports it. The trust does not rest on that repo alone: a
          # signature counts only when its key is one of the master keys
          # below, or is listed in packager-keyids and certified by one of
          # them. The master fingerprints are the ones msys2.org/dev/keyring
          # gives, checked on 2026-11-27.
          masters="D55E7A6D7CE9BA1587C0ACACF40D263ECA25678A
          B91BCF3303284BF90CC043CA9F418C233E652008
          9DD0D4217D75A33B896159E6DA7EF2ABAEEA755C
          6E8FEAFF9644F54EED90EEA0790AE56A1D3CFDDC
          69985C5EB351011C78DF7F6D755B8182ACD22879"
          masters=$(printf '%s\n' "$masters" | tr -d ' ')
          git clone -q --depth 1 https://github.com/msys2/MSYS2-keyring.git keyring
          export GNUPGHOME="$PWD/keys"
          chmod 700 keys
          gpg --batch -q --import keyring/msys2.gpg
          status=$(gpg --batch --status-fd 1 --verify "dist/$FILE.sig" "dist/$FILE" 2>/dev/null || true)
          # VALIDSIG's last field is the primary key, also for a subkey signature.
          signer=$(printf '%s\n' "$status" | awk '$2 == "VALIDSIG" { print $NF }')
          [ -n "$signer" ] || { echo "no good signature on $FILE"; printf '%s\n' "$status"; exit 1; }
          if printf '%s\n' "$status" | grep -qE '^\[GNUPG:\] (REVKEYSIG|KEYREVOKED)'; then
            echo "$FILE is signed by $signer, a revoked key"; exit 1
          fi
          if printf '%s\n' "$masters" | grep -qx "$signer"; then
            echo "signed by $signer, an MSYS2 master key"
          else
            awk '{ print $1 }' keyring/packager-keyids | grep -qx "$signer" \
              || { echo "$FILE is signed by $signer, which MSYS2 does not list as a packager key"; exit 1; }
            # sig records with ! are certifications gpg checked as good; field 5 is the issuer's key id.
            by=$(gpg --batch --with-colons --check-sigs "$signer" 2>/dev/null \
              | awk -F: '$1 == "sig" && $2 == "!" { print $5 }' | sort -u \
              | grep -xF -f <(printf '%s\n' "$masters" | cut -c25-40) || true)
            [ -n "$by" ] || { echo "$FILE is signed by $signer, which no MSYS2 master key certifies"; exit 1; }
            echo "signed by $signer ($(awk -v k="$signer" '$1 == k { print $2 }' keyring/packager-keyids)), certified by master keys: $(echo $by)"
          fi
          # The package must hold zsh itself, for Git for Windows' usr/bin.
          # The list goes to a file first: grep -q stops reading at its match,
          # and tar's write error would then fail the step under pipefail.
          tar --zstd -tf "dist/$FILE" > files.txt
          grep -qx 'usr/bin/zsh.exe' files.txt || { echo "no usr/bin/zsh.exe in $FILE"; grep '^usr/bin/' files.txt; exit 1; }
          tar --zstd -xOf "dist/$FILE" .PKGINFO | grep -E '^(pkgver|depend) ='
          (cd dist && sha256sum "$FILE" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish the release
        if: steps.have.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
          FILE: ${{ steps.pick.outputs.file }}
        run: |
          set -euo pipefail
          tag="zsh-v$VERSION"
          {
            echo "Mirror of MSYS2's zsh $VERSION package from $REPO_URL. Not an official release."
            echo
            echo "For Git for Windows: unpack \`$FILE\` into the Git folder, so \`usr/bin/zsh.exe\` lands beside Git's \`bash.exe\`."
            echo "It needs libiconv, libpcre2_8 and ncurses, which Git for Windows already ships."
            echo
            echo "\`$FILE.sig\` is MSYS2's own signature; it was checked against MSYS2's packager and master keys before publishing."
          } > notes.md
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" \
              --title "zsh $VERSION (MSYS2)" --notes-file notes.md --latest=false
          fi
