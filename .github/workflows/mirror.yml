# Copies each new Herdr app and herdr-core release from releases.herdr.dev
# into GitHub releases here (app: v<version>, core: core-v<version>). Only
# Windows x64 for now. The app's zip keeps the herdr-app folder whole: the
# app updates itself only when herdr-app.svg sits beside the exe.
name: mirror

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version to mirror (empty: the latest)"
        required: false
      core_version:
        description: "Core version to mirror (empty: the latest)"
        required: false

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  RELEASES_URL: https://releases.herdr.dev
  TARGET: windows-x86_64
  UA: "herdr-app-mirror (+https://github.com/${{ github.repository }})"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { product: app, name: herdr-app, tag: v, latest: true, title: "Herdr" }
          - { product: core, name: herdr-core, tag: core-v, latest: false, title: "herdr-core" }
    env:
      PRODUCT: ${{ matrix.product }}
      NAME: ${{ matrix.name }}
      TAG_PREFIX: ${{ matrix.tag }}
      WANT: ${{ matrix.product == 'app' && inputs.app_version || inputs.core_version }}
    steps:
      - name: Read the manifest
        id: manifest
        run: |
          set -euo pipefail
          if [ -n "${WANT:-}" ]; then
            path="$PRODUCT/$WANT/manifest.json"
          else
            path="$PRODUCT/latest.json"
          fi
          curl -fsSL -A "$UA" "$RELEASES_URL/$path" -o manifest.json
          cat manifest.json
          version=$(jq -r .version manifest.json)
          url=$(jq -r --arg t "$TARGET" '.targets[$t].url // empty' manifest.json)
          sha=$(jq -r --arg t "$TARGET" '.targets[$t].sha256 // empty' manifest.json)
          [ -n "$url" ] && [ -n "$sha" ] || { echo "no $TARGET build in $path"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$url")" >> "$GITHUB_OUTPUT"

      - name: Skip a version already mirrored
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          zip="$NAME-$TARGET.zip"
          if gh release view "$TAG_PREFIX$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$zip"; then
            echo "$TAG_PREFIX$VERSION already has $zip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and check
        if: steps.have.outputs.skip != 'true'
        env:
          URL: ${{ steps.manifest.outputs.url }}
          SHA: ${{ steps.manifest.outputs.sha }}
          FILE: ${{ steps.manifest.outputs.file }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist work
          curl -fsSL -A "$UA" --retry 3 "$URL" -o "dist/$FILE"
          echo "$SHA  dist/$FILE" | sha256sum -c -
          zip="dist/$NAME-$TARGET.zip"
          case "$FILE" in
            *.tar.gz)
              # The app: a herdr-app folder, repacked as a zip for Windows.
              tar -xzf "dist/$FILE" -C work
              [ -f work/herdr-app/herdr-app.exe ] && [ -f work/herdr-app/herdr-app.svg ] || { echo "unexpected layout"; ls -R work; exit 1; }
              (cd work && zip -qr "../$zip" herdr-app)
              cp work/herdr-app/LICENSE work/herdr-app/THIRD-PARTY-NOTICES dist/
              ;;
            *.zip)
              # The core already ships as a zip: publish it as it is.
              [ "dist/$FILE" = "$zip" ] || mv "dist/$FILE" "$zip"
              unzip -l "$zip"
              unzip -q "$zip" -d work
              find work -maxdepth 2 \( -name 'LICENSE*' -o -name 'THIRD-PARTY-NOTICES*' \) -type f -exec cp {} dist/ \;
              ;;
            *) echo "unknown file type: $FILE"; exit 1 ;;
          esac
          (cd dist && sha256sum "$NAME"-* > SHA256SUMS)
          cat dist/SHA256SUMS
          if [ "$PRODUCT" = app ] && curl -fsSL -A "$UA" "$RELEASES_URL/app/$VERSION/changelog.md" -o changelog.md; then
            :
          else
            jq -r '.notes // "No notes."' manifest.json > changelog.md
          fi

      - name: Publish the release
        if: steps.have.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
          SHA: ${{ steps.manifest.outputs.sha }}
          FILE: ${{ steps.manifest.outputs.file }}
          TITLE: ${{ matrix.title }}
          LATEST: ${{ matrix.latest }}
        run: |
          set -euo pipefail
          tag="$TAG_PREFIX$VERSION"
          {
            echo "Mirror of $TITLE $VERSION from $RELEASES_URL. Not an official release."
            echo
            if [ "$PRODUCT" = app ]; then
              echo "**Windows x64:** download \`$NAME-$TARGET.zip\`, extract it, and run \`herdr-app\\herdr-app.exe\`."
              echo "Keep the files together: the app updates itself only from the whole folder."
              echo "The app also needs herdr-core: see the latest \`core-v*\` release here."
            else
              echo "**Windows x64:** download \`$NAME-$TARGET.zip\` and extract it. The Herdr app uses this core."
            fi
            echo
            echo "Upstream sha256 of \`$FILE\`: \`$SHA\`"
            echo
            echo "<details><summary>Changelog</summary>"
            echo
            cat changelog.md
            echo
            echo "</details>"
          } > notes.md
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* -R "$GITHUB_REPOSITORY" \
              --title "$TITLE $VERSION" --notes-file notes.md --latest="$LATEST"
          fi

  # The update feed: the same paths releases.herdr.dev serves, on the
  # `updates` branch, so HERDR_RELEASES_URL can point at
  # https://raw.githubusercontent.com/<repo>/updates. Rebuilt from the
  # releases here each run: each manifest is upstream's, with its targets cut
  # to the builds mirrored here and their URLs pointed at these releases. The
  # sha256 stays upstream's, so a mirrored file that differs fails to install.
  feed:
    needs: mirror
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p feed && cd feed
          git init -q -b updates
          if git fetch -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" updates 2>/dev/null; then
            git checkout -q FETCH_HEAD -B updates
          fi
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' > ../tags
          python3 - "$GITHUB_REPOSITORY" "$RELEASES_URL" "$TARGET" "$UA" < ../tags <<'PY'
          import json, pathlib, re, sys, urllib.request
          repo, upstream, target, ua = sys.argv[1:5]
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": ua})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()
          def key(v):
              return tuple(int(x) for x in re.findall(r"\d+", v))
          products = {
              "app": ("v", f"herdr-app-{target}.tar.gz"),
              "core": ("core-v", f"herdr-core-{target}.zip"),
          }
          tags = sys.stdin.read().split()
          for product, (prefix, asset) in products.items():
              versions = [t[len(prefix):] for t in tags if re.fullmatch(re.escape(prefix) + r"\d+(\.\d+)*", t)]
              latest = None
              for v in sorted(versions, key=key):
                  m = json.loads(get(f"{upstream}/{product}/{v}/manifest.json"))
                  t = m["targets"].get(target)
                  if not t:
                      continue
                  m["targets"] = {target: {"url": f"https://github.com/{repo}/releases/download/{prefix}{v}/{asset}", "sha256": t["sha256"]}}
                  d = pathlib.Path(product, v)
                  d.mkdir(parents=True, exist_ok=True)
                  (d / "manifest.json").write_text(json.dumps(m, indent=2) + "\n")
                  if product == "app" and not (d / "changelog.md").exists():
                      try:
                          (d / "changelog.md").write_bytes(get(f"{upstream}/app/{v}/changelog.md"))
                      except Exception as e:
                          print(f"no changelog for app {v}: {e}")
                  latest = m
              if latest:
                  pathlib.Path(product, "latest.json").write_text(json.dumps(latest, indent=2) + "\n")
                  print(f"{product}/latest.json -> {latest['version']}")
          PY
          # The installers, from each project's source, so they read this feed too.
          curl -fsSL https://raw.githubusercontent.com/herdrdev/herdr-app/master/distribution/install.ps1 -o app/install.ps1
          curl -fsSL https://raw.githubusercontent.com/herdrdev/herdr-app/master/distribution/install.sh -o app/install.sh
          curl -fsSL https://raw.githubusercontent.com/herdrdev/herdr-core/master/distribution/install.ps1 -o core/install.ps1
          curl -fsSL https://raw.githubusercontent.com/herdrdev/herdr-core/master/distribution/install.sh -o core/install.sh
          git add -A
          if git diff --cached --quiet; then
            echo "feed unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(feed): update the release feed"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" updates
          git show --stat --oneline HEAD | head -30
